<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard - Cafe Fairuz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --primary: #6F4E37; --accent: #f39c12; --bg: #fdfaf7; 
            --white: #ffffff; --success: #27ae60; --error: #e74c3c;
            --ojol-color: #00AA13;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: #333; line-height: 1.5; }

        .navbar { 
            background: var(--primary); color: var(--white); padding: 15px; 
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar h1 { margin: 0; font-size: 1.2rem; }

        .container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }

        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .stat-card { background: var(--white); padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card h2 { margin: 5px 0; color: var(--primary); font-size: 1.8rem; }
        .stat-card small { font-size: 0.75rem; color: #777; font-weight: 600; }

        .admin-card { background: var(--white); padding: 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .card-header h3 { margin: 0; font-size: 1rem; color: var(--primary); }

        .q-item { 
            padding: 12px; background: #fff; border-radius: 15px; margin-bottom: 10px; 
            border: 1px solid #eee; display: flex; align-items: center; gap: 12px;
        }
        .q-item.is-ojol { border-left: 5px solid var(--ojol-color); background: #f0fff1; }

        .q-badge { 
            background: var(--primary); color: white; min-width: 50px; height: 50px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            font-weight: bold; font-size: 1.1rem;
        }

        .info { flex: 1; min-width: 0; }
        .info b { display: block; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info small { color: #888; font-size: 0.75rem; }

        .call-counter { font-size: 0.7rem; color: var(--accent); font-weight: bold; display: inline-block; margin-top: 3px; background: rgba(243, 156, 18, 0.1); padding: 1px 6px; border-radius: 4px; }
        .tag-ojol { display: inline-block; font-size: 0.65rem; font-weight: bold; color: var(--ojol-color); background: rgba(0, 170, 19, 0.1); padding: 1px 6px; border-radius: 4px; margin-top: 3px; }

        .btn-group { display: flex; gap: 8px; }
        .btn { border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        
        .btn-call { background: var(--accent); color: white; font-size: 1.2rem; width: 45px; height: 45px; }
        
        .btn-done { background: var(--success); color: white; height: 45px; padding: 0 20px; font-size: 0.85rem; }
        
        .btn-del { background: var(--error); color: white; padding: 0 15px; height: 40px; font-size: 0.8rem; }

        .btn:active { transform: scale(0.92); }
        .empty-state { text-align: center; padding: 20px; color: #ccc; font-size: 0.8rem; }

        @media (max-width: 480px) {
            .btn-done { padding: 0 12px; font-size: 0.75rem; }
            .btn-done span::after { content: "SELESAI"; } 
            .q-badge { min-width: 45px; height: 45px; font-size: 1rem; }
            .info b { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>🛠️ Admin Cafe Fairuz</h1>
    </nav>

    <div class="container">
        <div class="stat-grid">
            <div class="stat-card">
                <small>AKTIF</small>
                <h2 id="count-active">0</h2>
            </div>
            <div class="stat-card">
                <small>SIAP</small>
                <h2 id="count-done" style="color: var(--success);">0</h2>
            </div>
        </div>

        <div class="admin-card">
            <div class="card-header">
                <h3>⏳ Antrean Aktif</h3>
                <button onclick="refresh()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:bold; font-size:0.8rem;">🔄 REFRESH</button>
            </div>
            <div id="admin-list"></div>
        </div>

        <div class="admin-card" style="border: 2px solid #e8f5e9;">
            <div class="card-header">
                <h3>✅ Siap Diambil</h3>
            </div>
            <div id="done-list"></div>
        </div>
    </div>

    <script>
        let callCounts = {};

        async function refresh() {
            try {
                const res = await fetch('/monitor?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('count-active').innerText = data.antrean.length;
                document.getElementById('count-done').innerText = data.selesai.length;
                
                let sortedAntrean = data.antrean.map(o => ({
                    ...o,
                    priority: o.asal === 'Ojol' ? 1 : 2
                })).sort((a, b) => a.priority - b.priority);

                const list = document.getElementById('admin-list');
                if (sortedAntrean.length === 0) {
                    list.innerHTML = '<div class="empty-state">Belum ada pesanan masuk.</div>';
                } else {
                    list.innerHTML = sortedAntrean.map(o => {
                        const count = callCounts[o.id] || 0;
                        const callTag = count > 0 ? `<br><span class="call-counter">Dipanggil ${count}x</span>` : '';
                        return `
                        <div class="q-item ${o.asal === 'Ojol' ? 'is-ojol' : ''}">
                            <div class="q-badge" style="${o.asal === 'Ojol' ? 'background: var(--ojol-color);' : ''}">${String(o.id).slice(-3)}</div>
                            <div class="info">
                                <b>${o.item}</b>
                                <small>${o.asal} • ${o.waktu || 'Langsung'}</small>
                                ${o.asal === 'Ojol' ? '<br><span class="tag-ojol">PRIORITAS OJOL</span>' : ''}
                                ${callTag}
                            </div>
                            <div class="btn-group">
                                <button onclick='callCustomer(${JSON.stringify(o)})' class="btn btn-call" title="Panggil">📢</button>
                                <button onclick="markDone('${o.id}')" class="btn btn-done">SELESAI</button>
                            </div>
                        </div>`;
                    }).join('');
                }

                const doneList = document.getElementById('done-list');
                if (data.selesai.length === 0) {
                    doneList.innerHTML = '<div class="empty-state">Belum ada pesanan siap.</div>';
                } else {
                    doneList.innerHTML = data.selesai.map(o => `
                        <div class="q-item" style="border-left: 5px solid var(--success); opacity: 0.8;">
                            <div class="q-badge" style="background: #999;">${String(o.id).slice(-3)}</div>
                            <div class="info">
                                <b>${o.item}</b>
                                <small style="color: var(--success);">Sudah Siap</small>
                            </div>
                            <button onclick="deletePermanent('${o.id}')" class="btn btn-del">HAPUS</button>
                        </div>`).join('');
                }
            } catch(e) { console.error(e); }
        }

        async function callCustomer(order) {
            callCounts[order.id] = (callCounts[order.id] || 0) + 1;
            await fetch('/panggil', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: order.id })
            });
            Swal.fire({ title: `Panggilan ke-${callCounts[order.id]}`, timer: 800, showConfirmButton: false, toast: true, position: 'top-end', icon: 'success' });
            refresh();
        }

        async function markDone(id) {
            await fetch('/selesai', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: parseInt(id)}) });
            delete callCounts[id];
            refresh();
        }

        async function deletePermanent(id) {
            const result = await Swal.fire({ title: 'Hapus Pesanan?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#e74c3c', confirmButtonText: 'Hapus' });
            if (result.isConfirmed) {
                await fetch('/delete_permanent', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: parseInt(id)}) });
                refresh();
            }
        }

        setInterval(refresh, 5000);
        refresh();
    </script>
</body>
</html>
