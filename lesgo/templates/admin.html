<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cafe Fairuz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --primary: #6F4E37; --accent: #f39c12; --bg: #fdfaf7; 
            --white: #ffffff; --success: #27ae60; --error: #e74c3c;
            --dark-id: #6F4E37;
        }
        
        body { font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: #333; }

        .navbar { 
            background: var(--primary); color: var(--white); padding: 20px; 
            text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .container { max-width: 900px; margin: 30px auto; padding: 0 15px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .stat-card h2 { margin: 5px 0; color: var(--primary); }

        .admin-card { background: var(--white); padding: 25px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 25px; }
        
        .q-item { 
            padding: 15px; background: #fff; border-radius: 20px; margin-bottom: 12px; 
            border: 1.5px solid #f0f0f0; display: flex; align-items: center; gap: 20px;
        }

        .list-number-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 70px;
            text-align: center;
            border-right: 2px solid #eee;
            padding-right: 15px;
        }
        .list-number-label {
            font-size: 0.65rem;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .list-number-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
            margin-top: 2px;
        }

        /* ID Box */
        .q-id-box { 
            background: var(--dark-id); color: #fff; 
            min-width: 75px; height: 65px; border-radius: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .q-id-box small { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; opacity: 0.9; }
        .q-id-box span { font-size: 1.4rem; font-weight: 700; }

        .info { flex: 1; }
        .info b { display: block; font-size: 1.05rem; color: #222; }
        .info small { color: #777; font-size: 0.85rem; display: block; margin-top: 4px; }

        .btn-group { display: flex; gap: 10px; }
        .btn { border: none; border-radius: 12px; cursor: pointer; padding: 12px; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-call { background: var(--accent); color: white; font-size: 1.4rem; width: 50px; }
        .btn-done { background: var(--success); color: white; padding: 0 20px; }
        .btn-del { background: var(--error); color: white; padding: 0 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <h1>🛠️ Dashboard Admin - Cafe Fairuz</h1>
    </nav>

    <div class="container">
        <div class="stat-grid">
            <div class="stat-card">
                <small>Sedang Mengantri</small>
                <h2 id="count-active">0</h2>
            </div>
            <div class="stat-card">
                <small>Siap Diambil</small>
                <h2 id="count-done" style="color: var(--success);">0</h2>
            </div>
        </div>

        <div class="admin-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3>⏳ Dashboard Antrian</h3>
                <button onclick="refresh()" style="background:none; border:none; color:var(--primary); cursor:pointer; font-weight:bold;">🔄 REFRESH</button>
            </div>
            <div id="admin-list"></div>
        </div>

        <div class="admin-card" style="border: 2px solid #e8f5e9;">
            <h3>✅ Siap Diambil / Selesai</h3>
            <div id="done-list"></div>
        </div>
    </div>

    <script>
        async function refresh() {
            try {
                const res = await fetch('/monitor?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('count-active').innerText = data.antrean.length;
                document.getElementById('count-done').innerText = data.selesai.length;
                
                const list = document.getElementById('admin-list');
                if (!data.antrean || data.antrean.length === 0) {
                    list.innerHTML = '<div class="empty-state">Belum ada pesanan masuk.</div>';
                } else {
                    list.innerHTML = data.antrean.map((o, idx) => `
                        <div class="q-item">
                            <div class="list-number-wrapper">
                                <div class="list-number-label">Antrian Ke</div>
                                <div class="list-number-value">${idx + 1}</div>
                            </div>
                            <div class="q-id-box">
                                <small>ID</small>
                                <span>${String(o.id).slice(-3)}</span>
                            </div>
                            <div class="info">
                                <b>${o.item}</b>
                                <small>📍 ${o.asal} • 🕒 ${o.waktu || 'Langsung'}</small>
                            </div>
                            <div class="btn-group">
                                <button onclick='callCustomer(${JSON.stringify(o)})' class="btn btn-call">📢</button>
                                <button onclick="markDone('${o.id}')" class="btn btn-done">SELESAI</button>
                            </div>
                        </div>
                    `).join('');
                }

                const doneList = document.getElementById('done-list');
                if (!data.selesai || data.selesai.length === 0) {
                    doneList.innerHTML = '<div class="empty-state">Tidak ada pesanan yang siap.</div>';
                } else {
                    doneList.innerHTML = data.selesai.map((o, idx) => `
                        <div class="q-item" style="opacity: 0.85; border-left: 5px solid var(--success);">
                            <div class="list-number-wrapper" style="border-right: 2px solid #e8f5e9;">
                                <div class="list-number-label">Urutan</div>
                                <div class="list-number-value" style="color:#999;">${idx + 1}</div>
                            </div>
                            <div class="q-id-box" style="background:#555;">
                                <small>ID</small>
                                <span>${String(o.id).slice(-3)}</span>
                            </div>
                            <div class="info">
                                <b>${o.item}</b>
                                <small style="color: var(--success); font-weight:bold;">Status: SIAP DIKASIR</small>
                            </div>
                            <button onclick="deletePermanent('${o.id}')" class="btn btn-del">HAPUS</button>
                        </div>
                    `).join('');
                }
            } catch(e) { console.error("Refresh error:", e); }
        }

        async function callCustomer(order) {
            await fetch('/panggil', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: order.id })
            });
            Swal.fire({ title: 'Memanggil #' + String(order.id).slice(-3), timer: 800, showConfirmButton: false, toast: true, position: 'top-end', icon: 'success' });
        }

        async function markDone(id) {
            await fetch('/selesai', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: parseInt(id)})
            });
            refresh();
        }

        async function deletePermanent(id) {
            const result = await Swal.fire({
                title: 'Hapus Pesanan?',
                text: "Pastikan pelanggan sudah mengambil pesanannya.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'Ya, Hapus!'
            });
            if (result.isConfirmed) {
                await fetch('/delete_permanent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: parseInt(id)})
                });
                refresh();
            }
        }

        setInterval(refresh, 5000);
        refresh();
    </script>
</body>
</html>
