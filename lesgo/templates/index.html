<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cafe Fairuz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --primary: #6F4E37; --accent: #f39c12; --border: #E0D7D0; 
            --bg: #fdfaf7; --white: #ffffff; --text: #333;
            --success: #27ae60; --ojol-color: #00AA13; --danger: #e74c3c;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Poppins', sans-serif; margin: 0; background: var(--bg); color: var(--text); 
            min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* --- UI COMPONENTS --- */
        .navbar { 
            background: var(--primary); color: var(--white); 
            padding: 30px 20px 60px; text-align: center;
            border-radius: 0 0 50% 50% / 0 0 20px 20px;
            position: relative; z-index: 1;
        }

        .navbar h1 { 
            margin: 0; font-size: 1.5rem; letter-spacing: 1px; 
            display: flex; align-items: center; justify-content: center; gap: 15px; 
        }

        .navbar-logo {
            width: 80px; height: 80px; border-radius: 50%;
            object-fit: cover; border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        #main-app { 
            padding: 0 15px 140px; margin-top: -30px; 
            position: relative; z-index: 10;
            display: flex; justify-content: center;
        }
        
        .container { width: 100%; max-width: 450px; }

        .card { 
            background: var(--white); padding: 20px; border-radius: 24px; 
            border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            margin-bottom: 20px;
        }

        .card h3 { 
            margin: 0 0 15px 0; font-size: 0.9rem; color: var(--primary); 
            text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #eee; padding-bottom: 10px;
        }

        .menu-grid { 
            display: none;
            grid-template-columns: 1fr 1fr; gap: 12px; 
            margin-bottom: 20px; max-height: 400px; overflow-y: auto; padding: 5px;
        }

        .menu-grid::-webkit-scrollbar { width: 5px; }
        .menu-grid::-webkit-scrollbar-thumb { background: #eee; border-radius: 10px; }
        
        .menu-card { 
            background: var(--white); border: 1px solid var(--border); 
            border-radius: 18px; overflow: hidden; cursor: pointer; transition: 0.2s;
            position: relative; display: block;
        }

        .menu-card:active { transform: scale(0.96); }
        .menu-card img { width: 100%; height: 110px; object-fit: cover; }
        
        .menu-card_info, .menu-info { 
            padding: 12px 10px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center; 
        }
        .menu-info b { display: block; font-size: 0.85rem; width: 100%; text-align: center; margin-bottom: 2px; }
        .menu-info span { font-size: 0.8rem; color: var(--accent); font-weight: 600; display: block; width: 100%; text-align: center; }
        
        .steam-container {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 3px; z-index: 2; pointer-events: none;
        }
        .steam-line {
            width: 2px; height: 15px; background: rgba(255,255,255,0.6);
            border-radius: 2px; animation: steam-rise 2s infinite ease-in-out; opacity: 0;
        }
        @keyframes steam-rise {
            0% { transform: translateY(0) scaleX(1); opacity: 0; }
            50% { transform: translateY(-10px) scaleX(1.5); opacity: 0.6; }
            100% { transform: translateY(-20px) scaleX(2); opacity: 0; }
        }

        /* --- CART & FORM --- */
        #cart-list { max-height: 200px; overflow-y: auto; margin-bottom: 10px; }
        .cart-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px dashed #ddd;
        }
        .item-info { display: flex; flex-direction: column; gap: 2px; }
        .item-info b { font-size: 0.9rem; }
        .item-info span { font-size: 0.8rem; color: var(--accent); font-weight: 600; }

        .qty-controls { display: flex; align-items: center; gap: 12px; background: #f5f0ed; padding: 5px 10px; border-radius: 12px; }
        .btn-qty { border: none; background: none; color: var(--primary); font-weight: bold; font-size: 1.2rem; cursor: pointer; padding: 0 5px; }
        .qty-val { font-size: 0.9rem; font-weight: 600; min-width: 15px; text-align: center; }

        select, input { 
            width: 100%; padding: 12px 15px; border-radius: 12px; 
            border: 1px solid var(--border); font-family: 'Poppins', sans-serif; font-size: 0.9rem;
            background: #fff; outline: none; margin-bottom: 10px;
            color: #555;
        }

        #error-msg {
            color: var(--danger); font-size: 0.75rem; font-weight: 600;
            margin-top: -5px; margin-bottom: 10px; display: none; text-align: center;
        }

        .sched-box { 
            background: #f9f6f4; padding: 15px; border-radius: 15px; 
            border: 1px solid var(--border); margin-bottom: 10px;
            display: none; animation: fadeIn 0.3s;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake { animation: shake 0.4s ease-in-out; }

        .btn-pay { 
            background: var(--accent); color: var(--white); width: 100%; padding: 16px; 
            border: none; border-radius: 15px; font-weight: bold; cursor: pointer; 
            margin-top: 10px; font-size: 1rem; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
            transition: 0.3s;
        }
        .btn-pay:disabled { 
            background: #ccc !important; 
            box-shadow: none !important; 
            cursor: not-allowed !important; 
            opacity: 0.8;
        }

        .status-badge { padding: 4px 10px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; }
        
        .btn-cancel-order {
            background: none; border: 1px solid var(--danger); color: var(--danger);
            font-size: 0.7rem; font-weight: 600; padding: 3px 8px; border-radius: 8px;
            cursor: pointer; margin-top: 8px; transition: 0.2s; display: inline-block;
        }
        .btn-cancel-order:active { background: rgba(231, 76, 60, 0.1); }
        
        .no-cancel-text {
            font-size: 0.65rem; color: var(--danger); font-weight: 600;
            text-align: right; margin-top: 5px; line-height: 1.2;
            white-space: nowrap; /* Menjaga teks agar tetap satu baris horizontal */
        }

        .tag-ojol {
            display: inline-block; margin-top: 4px; font-size: 0.65rem; font-weight: bold;
            color: var(--ojol-color); background: rgba(0, 170, 19, 0.1); padding: 2px 6px; border-radius: 5px;
        }

        .waves-outer { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: auto; 
            pointer-events: none; z-index: 0; line-height: 0;
            display: flex; flex-direction: column;
        }
        .waves { position: relative; width: 100%; height: 60px; min-height: 60px; margin-bottom: -1px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
        .wave-base { background: var(--primary); height: 80px; width: 100%; margin-top: -1px; }

        #login-screen { 
            position: fixed; inset: 0; background: var(--primary); 
            z-index: 1000; display: flex; align-items: center; justify-content: center; 
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div style="background:#fff; padding:40px; border-radius:35px; text-align:center; width:90%; max-width:360px;">
            <h2 style="color:var(--primary); margin:0;">☕ Cafe Fairuz</h2>
            <p style="color:#777; margin-bottom:25px;">Selamat datang di Cafe Fairuz</p>
            <button class="btn-pay" onclick="start()" style="margin:0">MULAI PESAN</button>
        </div>
    </div>

    <nav class="navbar">
        <h1>
            <img src="/static/img/avatarlogo.png" alt="Logo" class="navbar-logo">
            Cafe Fairuz
        </h1>
    </nav>

    <div id="main-app">
        <div class="container">
            <div class="card">
                <h3>🛒 Pilihan Menu</h3>
                
                <select id="category-filter" onchange="filterMenu()" style="margin-bottom: 20px;">
                    <option value="" disabled selected>🔍 Silahkan pilih menu</option>
                    <option value="semua">📑 Semua Menu</option>
                    <option value="minuman">☕ Minuman</option>
                    <option value="snack">🍟 Snack / Cemilan</option>
                    <option value="makanan">🍲 Makanan Berat</option>
                </select>

                <div class="menu-grid" id="menu-container">
                    <div class="menu-card" data-category="minuman" onclick="add('Air Putih', 5000)"><img src="/static/img/air_putih.jpg"><div class="menu-info"><b>Air Putih</b><span>5rb</span></div></div>
                    <div class="menu-card" data-category="minuman" onclick="add('Kopi Aren', 15000)"><div class="steam-container"><div class="steam-line"></div><div class="steam-line"></div><div class="steam-line"></div></div><img src="/static/img/kopi_aren.jpg"><div class="menu-info"><b>Kopi Aren</b><span>15rb</span></div></div>
                    <div class="menu-card" data-category="minuman" onclick="add('Kopi Susu', 12000)"><div class="steam-container"><div class="steam-line"></div><div class="steam-line"></div><div class="steam-line"></div></div><img src="/static/img/kopi_susu.jpg"><div class="menu-info"><b>Kopi Susu</b><span>12rb</span></div></div>
                    <div class="menu-card" data-category="minuman" onclick="add('Matcha Latte', 18000)"><div class="steam-container"><div class="steam-line"></div><div class="steam-line"></div><div class="steam-line"></div></div><img src="/static/img/matcha_latte.jpg"><div class="menu-info"><b>Matcha Latte</b><span>18rb</span></div></div>
                    <div class="menu-card" data-category="minuman" onclick="add('Blue Lagoon', 20000)"><img src="/static/img/blue_lagon.jpg"><div class="menu-info"><b>Blue Lagoon</b><span>20rb</span></div></div>
                    <div class="menu-card" data-category="snack" onclick="add('Kentang Goreng', 15000)"><img src="/static/img/kentang_goreng.jpg"><div class="menu-info"><b>Kentang Goreng</b><span>15rb</span></div></div>
                    <div class="menu-card" data-category="snack" onclick="add('Roti Bakar', 12000)"><img src="/static/img/roti_bakar.jpg"><div class="menu-info"><b>Roti Bakar</b><span>12rb</span></div></div>
                    <div class="menu-card" data-category="makanan" onclick="add('Mie Goreng', 10000)"><img src="/static/img/mie_goreng.jpg"><div class="menu-info"><b>Mie Goreng</b><span>10rb</span></div></div>
                    <div class="menu-card" data-category="makanan" onclick="add('Nasi Goreng', 25000)"><img src="/static/img/nasi_goreng.jpg"><div class="menu-info"><b>Nasi Goreng</b><span>25rb</span></div></div>
                </div>

                <div id="cart-list"></div>

                <div class="form-group" style="margin-top:15px;">
                    <select id="asal" onchange="toggleSched()">
                        <option value="">-- Pilih Opsi Pesanan --</option>
                        <option value="Walk-in">🚶 Walk-In</option>
                        <option value="Jadwal">📅 Web (Penjadwalan)</option>
                        <option value="Ojol">🛵 Ojek Online</option>
                    </select>
                    
                    <div id="error-msg">Pilih menu terlebih dahulu!</div>

                    <div id="sched-box" class="sched-box">
                        <small style="display:block; margin-bottom:5px; color:var(--primary); font-weight:600;">Waktu Pengambilan:</small>
                        <div style="display:flex; gap:10px;">
                            <input type="time" id="sched-time">
                            <input type="date" id="sched-date">
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 2px solid var(--bg);">
                    <span>Total Bayar:</span>
                    <b id="total-txt" style="font-size: 1.2rem; color: var(--primary);">Rp 0</b>
                </div>
                
                <button class="btn-pay" id="btn-pay" onclick="pay()" disabled>KONFIRMASI PESANAN</button>
            </div>

            <div id="order-status-container"></div>
        </div>
    </div>

    <div class="waves-outer">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
            <g class="parallax">
                <use href="#gentle-wave" x="48" y="0" fill="rgba(111, 78, 55, 0.7)" />
                <use href="#gentle-wave" x="48" y="3" fill="rgba(111, 78, 55, 0.5)" />
                <use href="#gentle-wave" x="48" y="5" fill="rgba(111, 78, 55, 0.3)" />
                <use href="#gentle-wave" x="48" y="7" fill="var(--primary)" />
            </g>
        </svg>
        <div class="wave-base"></div>
    </div>

    <script>
        let cart = [];
        let myOrderIds = JSON.parse(localStorage.getItem('my_orders') || "[]");
        let audioPlayer = new Audio();
        let lastCallTimestamp = Number(localStorage.getItem('last_call_time')) || 0; 
        let isCalling = false; 
        let currentActiveOrders = []; 

        function isFormDirty() {
            const asalSelect = document.getElementById('asal');
            const asalValue = asalSelect ? asalSelect.value : "";
            return (cart.length > 0 || asalValue !== "");
        }

        window.addEventListener('beforeunload', function (e) {
            if (isFormDirty()) {
                e.preventDefault();
                const msg = "Anda sedang memilih menu atau opsi pilihan pesanan. Yakin mau kembali/reload?";
                e.returnValue = msg;
                return msg;
            }
        });

        function initBackGuard() {
            if (window.history.state !== 'app-running') {
                window.history.pushState('app-running', null, '');
            }
        }

        window.addEventListener('popstate', async function (e) {
            if (isFormDirty()) {
                window.history.pushState('app-running', null, '');

                const result = await Swal.fire({
                    title: 'Yakin mau kembali/reload?',
                    text: 'Anda sedang melakukan pengisian menu atau opsi pesanan. Data inputan saat ini akan hilang.',
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#e74c3c',
                    cancelButtonColor: '#6F4E37',
                    confirmButtonText: 'Ya, Keluar',
                    cancelButtonText: 'Batal'
                });

                if (result.isConfirmed) {
                    cart = [];
                    if(document.getElementById('asal')) document.getElementById('asal').value = "";
                    window.history.go(-2); 
                }
            } else {
                window.history.go(-1); 
            }
        });

        function filterMenu() {
            const category = document.getElementById('category-filter').value;
            const container = document.getElementById('menu-container');
            const items = document.querySelectorAll('.menu-card');
            
            if (category !== "") {
                container.style.display = 'grid';
            }

            items.forEach(item => {
                if (category === 'semua') {
                    item.style.display = 'block';
                } else {
                    item.style.display = (item.getAttribute('data-category') === category) ? 'block' : 'none';
                }
            });
        }

        function start() {
            audioPlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
            audioPlayer.play().catch(e => {});
            document.getElementById('login-screen').style.display = 'none';
            initBackGuard(); 
            updateStatusPesanan();
        }

        function add(n, h) {
            let i = cart.find(x => x.n === n);
            i ? i.q++ : cart.push({n, h, q: 1});
            document.getElementById('error-msg').style.display = 'none';
            render();
        }

        function changeQty(n, delta) {
            let i = cart.find(x => x.n === n);
            if (i) {
                i.q += delta;
                if (i.q <= 0) cart = cart.filter(x => x.n !== n);
                render();
            }
        }

        function toggleSched() {
            const asalSelect = document.getElementById('asal');
            const errorMsg = document.getElementById('error-msg');
            if (cart.length === 0 && asalSelect.value !== "") {
                errorMsg.style.display = 'block';
                errorMsg.classList.add('shake');
                asalSelect.value = ""; 
                setTimeout(() => errorMsg.classList.remove('shake'), 400);
                return;
            }
            errorMsg.style.display = 'none';
            document.getElementById('sched-box').style.display = (asalSelect.value === 'Jadwal') ? 'block' : 'none';
            render();
        }

        function render() {
            let total = 0;
            const list = document.getElementById('cart-list');
            list.innerHTML = cart.map(i => {
                total += (i.h * i.q);
                return `<div class="cart-item">
                    <div class="item-info"><b>${i.n}</b><span>Rp ${(i.h * i.q).toLocaleString()}</span></div>
                    <div class="qty-controls">
                        <button class="btn-qty" onclick="changeQty('${i.n}', -1)">−</button>
                        <span class="qty-val">${i.q}</span>
                        <button class="btn-qty" onclick="changeQty('${i.n}', 1)">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('total-txt').innerText = "Rp " + total.toLocaleString();
            document.getElementById('btn-pay').disabled = cart.length === 0 || document.getElementById('asal').value === "";
        }

        async function pay() {
            const btn = document.getElementById('btn-pay');
            const asalSelect = document.getElementById('asal');
            const asal = asalSelect.value;
            let waktuInfo = "Langsung";
            
            if(asal === 'Jadwal') {
                const time = document.getElementById('sched-time').value;
                const date = document.getElementById('sched-date').value;
                if(!time || !date) return Swal.fire('Oops', 'Lengkapi waktu pengambilan!', 'warning');
                waktuInfo = `Tgl ${date} Jam ${time}`;
            }

            btn.disabled = true;
            btn.innerText = "SEDANG DIPROSES...";

            const payload = { item: cart.map(i => `${i.q} ${i.n}`).join(', '), asal: asal, waktu: waktuInfo };

            try {
                const res = await fetch('/checkout', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                const result = await res.json();
                
                myOrderIds.push(String(result.id));
                localStorage.setItem('my_orders', JSON.stringify(myOrderIds));
                
                await Swal.fire({ 
                    title: 'Pesanan Disimpan!', 
                    text: 'Nomor Antrian: ' + String(result.id).slice(-3), 
                    icon: 'success', 
                    confirmButtonColor: '#6F4E37' 
                });
                
                cart = []; 
                asalSelect.value = ""; 
                document.getElementById('sched-box').style.display = 'none';
                render(); 
                updateStatusPesanan();
                
            } catch(e) { 
                Swal.fire('Error', 'Gagal kirim pesan, coba lagi.', 'error'); 
                btn.disabled = false;
            } finally { 
                btn.innerText = "KONFIRMASI PESANAN";
            }
        }

        async function cancelOrder(orderId) {
            const orderDiSistem = currentActiveOrders.find(o => String(o.id) === String(orderId));
            
            if (orderDiSistem && orderDiSistem.estimasi_kustom) {
                Swal.fire({
                    title: 'Gagal Membatalkan',
                    text: 'Pesanan ini tidak bisa dibatalkan.',
                    icon: 'error',
                    confirmButtonColor: '#6F4E37'
                });
                return;
            }

            const resultConfirm = await Swal.fire({
                title: 'Batalkan Pesanan?',
                text: "Pesanan ini akan dihapus dari antrian.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#6F4E37',
                confirmButtonText: 'Ya, Batalkan!',
                cancelButtonText: 'Tidak'
            });

            if (!resultConfirm.isConfirmed) return;

            try {
                const res = await fetch('/delete_permanent', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: parseInt(orderId) })
                });

                if(res.ok) {
                    myOrderIds = myOrderIds.filter(id => String(id) !== String(orderId));
                    localStorage.setItem('my_orders', JSON.stringify(myOrderIds));
                    
                    Swal.fire({
                        title: 'Dibatalkan!',
                        text: 'Pesanan Anda berhasil dibatalkan.',
                        icon: 'success',
                        confirmButtonColor: '#6F4E37'
                    });
                    updateStatusPesanan();
                } else {
                    Swal.fire('Gagal', 'Pesanan gagal dibatalkan atau sudah diproses kasir.', 'error');
                }
            } catch(e) {
                Swal.fire('Error', 'Terjadi kesalahan jaringan.', 'error');
            }
        }

        async function updateStatusPesanan() {
            if (myOrderIds.length === 0) {
                document.getElementById('order-status-container').innerHTML = '';
                return;
            }
            try {
                const ts = Date.now();
                const [resMonitor, resPanggil] = await Promise.all([
                    fetch(`/monitor?t=${ts}`), 
                    fetch(`/cek_panggilan?t=${ts}`)
                ]);
                
                const data = await resMonitor.json();
                const dataPanggil = await resPanggil.json();
                const container = document.getElementById('order-status-container');
                
                currentActiveOrders = data.antrian || [];
                
                let htmlContent = ""; 
                let listTampil = [];

                myOrderIds.forEach(myId => {
                    const idStr = String(myId);
                    
                    const idxAktif = data.antrian.findIndex(o => String(o.id) === idStr);
                    const orderAktif = data.antrian[idxAktif];

                    if (orderAktif) {
                        let statusLabel = "SEDANG PROSES", bgColor = "#fff3e0", textColor = "#e67e22";
                        if (String(dataPanggil.panggil_id) === idStr) { 
                            statusLabel = "DIPANGGIL"; 
                            bgColor = "#e8f5e9"; 
                            textColor = "#27ae60"; 
                        }
                        
                        listTampil.push({ 
                            data: orderAktif, 
                            label: statusLabel, 
                            bg: bgColor, 
                            warna: textColor, 
                            priority: orderAktif.asal === 'Ojol' ? 1 : 2, 
                            urutan: idxAktif + 1 
                        });
                    } else {
                        const orderSelesai = data.selesai.find(o => String(o.id) === idStr);
                        if (orderSelesai) {
                            listTampil.push({ 
                                data: orderSelesai, 
                                label: "SIAP AMBIL", 
                                bg: "#e8f5e9", 
                                warna: "#27ae60", 
                                priority: 3, 
                                urutan: 0 
                            });
                        }
                    }
                });

                listTampil.sort((a, b) => a.priority - b.priority);

                if (listTampil.length > 0) {
                    listTampil.forEach(item => {
                        const priorityLabel = (item.data.asal === 'Ojol') ? '<div class="tag-ojol">Prioritas Driver Ojek Online</div>' : '';
                        let estimasiTxt = "";
                        let actionAreaHtml = ""; 
                        let statusSideInfoHtml = ""; 
                        
                        if (item.label === "SEDANG PROSES") {
                            if (item.data.estimasi_kustom) {
                                statusSideInfoHtml = `<div class="no-cancel-text">Tidak bisa dibatalkan</div>`;
                            } else {
                                actionAreaHtml = `<br><button class="btn-cancel-order" onclick="cancelOrder('${item.data.id}')">❌ Batalkan Pesanan</button>`;
                            }
                        }
                        
                        if (item.label !== "SIAP AMBIL") {
                            const estimasiValue = item.data.estimasi_kustom ? `±${item.data.estimasi_kustom} Menit` : "-";
                            const labelEstimasi = item.data.estimasi_kustom ? "Waktu Selesai" : "Estimasi";
                            
                            estimasiTxt = `<div style="font-size:0.7rem; color:var(--accent); font-weight:600; margin-top:4px;">⏳ ${labelEstimasi}: ${estimasiValue}</div>`;
                        }

                        htmlContent += `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; padding:12px 0; border-bottom:1px solid #eee;">
                            <div>
                                <b style="font-size:0.8rem;">#${String(item.data.id).slice(-3)}</b>
                                <div style="font-size:0.75rem; color:#666; max-width:180px;">${item.data.item}</div>
                                ${priorityLabel}${estimasiTxt}
                                ${actionAreaHtml}
                            </div>
                            <div style="display: flex; flex-direction: column; align-items: flex-end;">
                                <span class="status-badge" style="background:${item.bg}; color:${item.warna};">${item.label}</span>
                                ${statusSideInfoHtml}
                            </div>
                        </div>`;
                    });
                    container.innerHTML = `<div class="card" style="border-top: 4px solid var(--accent);"><h3>📋 Status Pesanan</h3>${htmlContent}</div>`;
                } else { 
                    container.innerHTML = ''; 
                }
            } catch(e) {}
        }

        async function pantauPanggilan() {
            if (isCalling) return; 
            try {
                const res = await fetch('/cek_panggilan?t=' + Date.now());
                const data = await res.json();
                if (data.panggil_id && Number(data.updated_at) > lastCallTimestamp) {
                    isCalling = true; 
                    lastCallTimestamp = Number(data.updated_at); 
                    localStorage.setItem('last_call_time', lastCallTimestamp);
                    
                    const menuDipilih = data.panggil_item || "pesanan Anda"; 
                    audioPlayer.src = `/get_audio/${encodeURIComponent(`Nomor antrian ${String(data.panggil_id).slice(-3)}, silahkan ambil ${menuDipilih}`)}`;
                    audioPlayer.play().catch(e => { isCalling = false; });
                    audioPlayer.onended = () => { isCalling = false; };
                    
                    if (myOrderIds.includes(String(data.panggil_id))) {
                        Swal.fire({ 
                            title: "PESANAN SIAP!", 
                            text: `Nomor Antrian #${String(data.panggil_id).slice(-3)} silahkan ambil ${menuDipilih}`, 
                            icon: "info", 
                            confirmButtonColor: '#6F4E37' 
                        });
                    }
                }
                updateStatusPesanan();
            } catch(e) { isCalling = false; }
        }

        setInterval(pantauPanggilan, 3000); 
    </script>
</body>
</html>
